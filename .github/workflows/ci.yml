name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Prisma 7 config requires DIRECT_URL; generate does not connect to the DB.
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  # AI Platform grew API typecheck past the default ~4 GiB heap on ubuntu-latest.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Workspace stays on pnpm 8; its `pnpm audit` still hits npm's retired
      # /security/audits endpoint (410). pnpm 11 uses /advisories/bulk, but only
      # if packageManager is also 11 — otherwise it re-execs the pinned 8.x.
      - name: Audit dependencies (fail on high/critical)
        env:
          PNPM_AUDIT_VERSION: '11.13.1'
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.packageManager = `pnpm@${process.env.PNPM_AUDIT_VERSION}`;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          npx --yes "pnpm@${PNPM_AUDIT_VERSION}" audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          install_dir="${RUNNER_TOOL_CACHE}/gitleaks"
          mkdir -p "$install_dir"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . --verbose --redact \
              --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --source . --verbose --redact \
              --log-opts "${{ github.event.before }}..${{ github.sha }}"
          else
            gitleaks detect --source . --verbose --redact
          fi
